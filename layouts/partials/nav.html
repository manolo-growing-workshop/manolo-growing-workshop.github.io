<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <img src="{{ "img/manolo.png" | relURL }}" alt="MANOLO" height="36">
      <span>Growing Neural Networks</span>
    </a>
    <nav>
      {{ $current := . }}
      {{ range site.Menus.main }}
        <a href="{{ .URL }}"{{ if $current.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
