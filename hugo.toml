# baseURL is overridden at deploy time by the GitHub Actions workflow,
# so the site works at https://<account>.github.io/<repo>/ or on a custom domain.
baseURL = "/"
languageCode = "en"
title = "MANOLO Workshop on Growing Neural Networks"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

[markup.goldmark.renderer]
  unsafe = true  # allow inline HTML in Markdown content

[params]
  tagline = "How can a neural network keep learning when its architecture changes?"
  description = "A one-day workshop on growing neural networks and on optimization when the trainable architecture changes during training. Inria Paris, December 2026."
  date = "7 or 8 December 2026"
  date_note = "exact date to be confirmed"
  place = "Inria Paris"

  # Replace "#" with the real form URLs when they exist; the buttons then go live.
  registration_url = "https://framaforms.org/registration-manolo-workshop-on-growing-neural-networks-1791993366"
  submission_url = "https://framaforms.org/poster-abstract-manolo-workshop-on-growing-neural-networks-1791995101"

  contact = ["manolo-growing-workshop@protonmail.com"]

  # Horizon Europe grant agreement number for the EU funding statement in the footer.
  grant_number = "101135782"

  # GoatCounter site code (the "xxx" in https://xxx.goatcounter.com) for cookieless visitor counts.
  # Leave empty to disable. Only loaded in production builds, so local previews aren't counted.
  goatcounter = "manolo-growing-workshop"

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 1
  [[menus.main]]
    name = "Programme"
    pageRef = "/programme"
    weight = 2
  [[menus.main]]
    name = "Call for posters"
    pageRef = "/call-for-posters"
    weight = 3
  [[menus.main]]
    name = "Practical info"
    pageRef = "/practical"
    weight = 4
